name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must stay quoted: unquoted 3.10 is YAML-parsed as the float 3.1
          # and setup-python fails with "Version 3.1 not found".
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        # Tests import `app.*`, so they must run with backend/ as the root.
        working-directory: backend
        run: python -m unittest discover -s tests

      - name: Build Docker image
        run: |
          docker build -t llm_code_navigator-backend ./backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Next.js 14 requires Node >= 18.17.
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend Docker image
        run: |
          docker build -t llm_code_navigator-frontend ./frontend

      - name: Run frontend linting
        working-directory: frontend
        run: npm run lint
