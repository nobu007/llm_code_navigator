name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Quoted so YAML keeps it a string; unquoted 3.10 is parsed as the
          # float 3.1 and setup-python then fails with "Version 3.1 not found".
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          cd backend
          python -m unittest discover -s tests

      - name: Run backend tests using Docker Compose
        run: |
          docker compose run --rm --entrypoint python backend -m unittest discover -s tests

      - name: Build Docker image
        run: |
          docker build -t llm_code_navigator-backend ./backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm test

      - name: Build frontend Docker image
        run: |
          docker build -t llm_code_navigator-frontend ./frontend

      - name: Run frontend linting
        run: |
          cd frontend
          npm run lint
