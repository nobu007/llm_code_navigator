version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: llm_code_navigator-backend
    ports:
      - "9000:9000"
    volumes:
      - ./work:/app/work
    environment:
      - BACKEND_DIR=/app/work
    networks:
      - app-network
    hostname: backend
    entrypoint: ["python", "-m", "app.main"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: llm_code_navigator-frontend
    ports:
      - "3000:3000"
    networks:
      - app-network
    hostname: frontend
    entrypoint: ["npm", "run", "dev"]

  ci:
    image: llm_code_navigator-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./work:/app/work
    environment:
      - BACKEND_DIR=/app/work
    networks:
      - app-network
    entrypoint: ["python", "-m", "unittest", "discover", "-s", "backend/tests"]

networks:
  app-network:
    driver: bridge
